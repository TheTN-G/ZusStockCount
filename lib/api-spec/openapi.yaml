        sku: { type: ["string", "null"] }
        category: { $ref: "#/components/schemas/ProductCategory" }
        defaultSectionId: { type: ["integer", "null"] }
        unit: { type: string, minLength: 1 }
        bundleUnit: { type: string, minLength: 1 }
        bundleSize: { type: number, minimum: 0.01 }
        minStock: { type: number, minimum: 0 }
        minStockUnit: { type: string, enum: [unit, bundle] }
        preferredSupplierId: { type: ["integer", "null"] }
        openingStock:
          type: object
          properties:
            quantity: { type: number, minimum: 0 }
            sectionId: { type: ["integer", "null"] }
            expiryDate: { type: ["string", "null"], format: date }
          required: [quantity]
        tempMinC: { type: ["number", "null"], minimum: -60, maximum: 100 }
        tempMaxC: { type: ["number", "null"], minimum: -60, maximum: 100 }
    ProductUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        sku: { type: ["string", "null"] }
        category: { $ref: "#/components/schemas/ProductCategory" }
        defaultSectionId: { type: ["integer", "null"] }
        unit: { type: string, minLength: 1 }
        bundleUnit: { type: string, minLength: 1 }
        bundleSize: { type: number, minimum: 0.01 }
        minStock: { type: number, minimum: 0 }
        minStockUnit: { type: string, enum: [unit, bundle] }
        preferredSupplierId: { type: ["integer", "null"] }
        active: { type: boolean }
        tempMinC: { type: ["number", "null"], minimum: -60, maximum: 100 }
