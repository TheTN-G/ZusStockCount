      properties:
        id: { type: integer }
        reference: { type: string }
        sourceOutletId: { type: integer }
        sourceOutletName: { type: string }
        destinationOutletId: { type: integer }
        destinationOutletName: { type: string }
        sourceProductId: { type: integer }
        sourceProductName: { type: string }
        destinationProductId: { type: integer }
        destinationProductName: { type: string }
        sourceSectionId: { type: ["integer", "null"] }
        sourceSectionName: { type: string }
        destinationSectionId: { type: ["integer", "null"] }
        destinationSectionName: { type: string }
        quantity: { type: number }
        unit: { type: string }
        sourceBefore: { type: number }
        sourceAfter: { type: number }
        destinationBefore: { type: number }
        destinationAfter: { type: number }
        sourceTotalBefore: { type: number }
        sourceTotalAfter: { type: number }
        destinationTotalBefore: { type: number }
        destinationTotalAfter: { type: number }
        note: { type: string }
        actor: { type: string }
        occurredAt: { type: string, format: date-time }
    Supplier:
      type: object
      required: [id, name, contactName, phone, email, notes, active, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        contactName: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    SupplierInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        contactName: { type: ["string", "null"], maxLength: 120 }
        phone: { type: ["string", "null"], maxLength: 40 }
        email: { type: ["string", "null"], format: email, maxLength: 320 }
        notes: { type: ["string", "null"], maxLength: 1000 }
    SupplierUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        contactName: { type: ["string", "null"], maxLength: 120 }
        phone: { type: ["string", "null"], maxLength: 40 }
        email: { type: ["string", "null"], format: email, maxLength: 320 }
        notes: { type: ["string", "null"], maxLength: 1000 }
        active: { type: boolean }
    StockBatch:
      type: object
      required: [id, productId, productName, quantity, receivedAt, sectionId, sectionName]
      properties:
        id: { type: integer }
        productId: { type: integer }
        productName: { type: string }
        quantity: { type: number }
        expiryDate: { type: ["string", "null"], format: date }
        receivedAt: { type: string, format: date-time }
        sectionId: { type: ["integer", "null"] }
        sectionName: { type: ["string", "null"] }
    StockAdjustmentInput:
      type: object
      required: [productId, quantityDelta, reason]
      properties:
        productId: { type: integer }
        sectionId: { type: integer }
        quantityDelta: { type: number }
        reason: { type: string, minLength: 1 }
        expiryDate: { type: ["string", "null"], format: date }
    PurchaseOrderLine:
      type: object
      required: [productId, productName, quantity, receivedQuantity, unit, conversionFactor]
      properties:
        productId: { type: integer }
        productName: { type: string }
        quantity: { type: number }
        receivedQuantity: { type: number }
        unit: { type: string }
        conversionFactor: { type: number }
    PurchaseOrder:
      type: object
      required: [id, status, requestedBy, createdAt, outlet, lines, orderNumber, expectedDeliveryDate, issuedAt]
      properties:
        id: { type: integer }
