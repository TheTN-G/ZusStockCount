        bundleUnit: { type: string }
        bundleSize: { type: number }
        minStock: { type: number }
        minStockUnit: { type: string, enum: [unit, bundle] }
        preferredSupplierId: { type: ["integer", "null"] }
        stockOnHand: { type: number }
        lowStock: { type: boolean }
        active: { type: boolean }
        tempMinC: { type: ["number", "null"] }
        tempMaxC: { type: ["number", "null"] }
    ProductInput:
      type: object
