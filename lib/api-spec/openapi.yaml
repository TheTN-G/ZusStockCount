openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: REST API for ZUS Store Stock
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Store overview
  - name: users
    description: Current user and role management
  - name: workspaces
    description: Workspace and outlet management
  - name: products
    description: Product catalog
  - name: inventory
    description: Stock batches and adjustments
  - name: orders
    description: Store purchase requests and receiving
  - name: counts
    description: Stock count sessions
  - name: movements
    description: Inventory audit trail
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Get the signed-in user's store profile and role
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
  /outlets:
    post:
      operationId: createOutlet
      tags: [workspaces]
      summary: Create an outlet in the signed-in owner's workspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OutletInput" }
      responses:
        "201":
          description: Outlet created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutletSummary" }
  /outlets/{outletId}:
    patch:
      operationId: updateOutlet
      tags: [workspaces]
      summary: Update outlet contact and address details (owners can update any workspace outlet; managers can update only their active assigned outlet)
      parameters:
        - in: path
          name: outletId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OutletUpdate" }
      responses:
        "200":
          description: Updated outlet details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutletSummary" }
        "400":
          description: Invalid outlet details
        "403":
          description: The signed-in user cannot update outlet details
        "404":
          description: Outlet is outside the owner's workspace or manager's assigned outlet
  /workspaces/me:
    patch:
      operationId: updateWorkspace
      tags: [workspaces]
      summary: Update the signed-in owner's workspace profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceUpdate" }
      responses:
        "200":
          description: Updated workspace profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceSummary" }
  /workspaces/me/setup:
    patch:
      operationId: completeWorkspaceSetup
      tags: [workspaces]
      summary: Complete the signed-in owner's workspace registration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceSetupInput" }
      responses:
        "200":
          description: Registered workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceSummary" }
  /users:
    get:
      operationId: listStoreUsers
      tags: [users]
      summary: List users and roles for this storeroom
      responses:
        "200":
          description: Storeroom team
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StoreUser" }
    post:
      operationId: addStoreMember
      tags: [users]
      summary: Add an existing account to the active storeroom
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddStoreMemberInput" }
      responses:
        "201":
          description: Storeroom team member added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreUser" }
  /users/invitations:
    get:
      operationId: listStoreInvitations
      tags: [users]
      summary: List invitations for the active storeroom
      responses:
        "200":
          description: Storeroom invitations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StoreInvitation" }
    post:
      operationId: createStoreInvitation
      tags: [users]
      summary: Invite an email address to the active storeroom
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreInvitationInput" }
      responses:
        "201":
          description: Invitation sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreInvitation" }
  /users/invitations/{invitationId}:
    delete:
      operationId: revokeStoreInvitation
      tags: [users]
      summary: Revoke a pending storeroom invitation
      parameters:
        - in: path
          name: invitationId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Revoked or already inactive invitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreInvitation" }
  /users/{userId}/password-reset:
    post:
      operationId: requestStoreUserPasswordReset
      tags: [users]
      summary: Start password recovery for a user in the active storeroom
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "201":
          description: Single-use password reset link was created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordResetRequest" }
  /users/password-reset/complete:
    post:
      operationId: completeStoreUserPasswordReset
      tags: [users]
      summary: Complete a password reset with a single-use token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompletePasswordResetInput" }
      responses:
        "200":
          description: Password was reset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompletePasswordResetResponse" }
  /users/security-events:
    get:
      operationId: listStoreSecurityEvents
      tags: [users]
      summary: List recent security events for the active storeroom
      responses:
        "200":
          description: Recent security events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SecurityEvent" }
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get stock, expiry, approval, and activity totals
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: Search and filter the product catalog
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: category
          schema: { $ref: "#/components/schemas/ProductCategory" }
        - in: query
          name: active
          schema: { type: boolean }
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
    post:
      operationId: createProduct
      tags: [products]
      summary: Add a product to the catalog
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /products/{productId}:
    parameters:
      - in: path
        name: productId
        required: true
        schema: { type: integer }
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product and its current stock
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Edit product details or deactivate it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductUpdate" }
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /product-categories:
    get:
      operationId: listProductCategories
      tags: [products]
      summary: List product categories for the selected outlet
      responses:
        "200":
          description: Product categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProductCategoryRecord" }
    post:
      operationId: createProductCategory
      tags: [products]
      summary: Add a product category to the selected outlet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductCategoryInput" }
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductCategoryRecord" }
  /product-categories/{categoryId}:
    parameters:
      - in: path
        name: categoryId
        required: true
        schema: { type: integer }
    patch:
      operationId: updateProductCategory
      tags: [products]
      summary: Rename an outlet product category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductCategoryUpdate" }
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductCategoryRecord" }
    delete:
      operationId: deleteProductCategory
      tags: [products]
      summary: Delete an unused outlet product category
      responses:
        "204":
          description: Category deleted
  /stock-sections:
    get:
      operationId: listStockSections
      tags: [inventory]
      summary: List physical stock sections for the selected outlet
      responses:
        "200":
          description: Stock sections
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StockSection" }
    post:
      operationId: createStockSection
      tags: [inventory]
      summary: Add a physical stock section to the selected outlet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockSectionInput" }
      responses:
        "201":
          description: Created section
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockSection" }
  /stock-sections/{sectionId}:
    parameters:
      - in: path
        name: sectionId
        required: true
        schema: { type: integer }
    patch:
      operationId: updateStockSection
      tags: [inventory]
      summary: Rename a stock section without changing balances
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockSectionUpdate" }
      responses:
        "200":
          description: Updated section
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockSection" }
    delete:
      operationId: deleteStockSection
      tags: [inventory]
      summary: Delete an empty non-default stock section
      responses:
        "204":
          description: Section deleted
  /stock-transfers:
    get:
      operationId: listStockTransfers
      tags: [inventory]
      summary: List transfers involving the selected outlet
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Stock transfer history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StockTransfer" }
    post:
      operationId: createStockTransfer
      tags: [inventory]
      summary: Move stock between outlet sections, including other outlets in the workspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockTransferInput" }
      responses:
        "201":
          description: Recorded stock transfer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockTransfer" }
  /stock-transfers/options:
    get:
      operationId: getStockTransferOptions
      tags: [inventory]
      summary: Get compatible products and section balances for a transfer
      parameters:
        - in: query
          name: destinationOutletId
          required: true
          schema: { type: integer }
        - in: query
          name: productId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Transfer source and destination choices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockTransferOptions" }
  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      summary: List suppliers for the selected outlet
      responses:
        "200":
          description: Suppliers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Supplier" }
    post:
      operationId: createSupplier
      tags: [suppliers]
      summary: Add an outlet supplier
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierInput" }
      responses:
        "201":
          description: Created supplier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Supplier" }
  /suppliers/{supplierId}:
    parameters:
      - in: path
        name: supplierId
        required: true
        schema: { type: integer }
    patch:
      operationId: updateSupplier
      tags: [suppliers]
      summary: Update or archive an outlet supplier
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierUpdate" }
      responses:
        "200":
          description: Updated supplier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Supplier" }
  /inventory/batches:
    get:
      operationId: listStockBatches
      tags: [inventory]
      summary: List stock batches, optionally filtered by product or expiry
      parameters:
        - in: query
          name: productId
          schema: { type: integer }
        - in: query
          name: expiringWithinDays
          schema: { type: integer, minimum: 1, maximum: 365 }
      responses:
        "200":
          description: Stock batches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StockBatch" }
  /inventory/adjustments:
    post:
      operationId: createStockAdjustment
      tags: [inventory]
      summary: Add or remove stock with an audit reason
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockAdjustmentInput" }
      responses:
        "201":
          description: Recorded inventory movement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockMovement" }
  /purchase-orders:
    get:
      operationId: listPurchaseOrders
      tags: [orders]
      summary: List store purchase requests and their lines
      parameters:
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/OrderStatus" }
      responses:
        "200":
          description: Purchase requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PurchaseOrder" }
    post:
      operationId: createPurchaseOrder
      tags: [orders]
      summary: Submit a purchase request for approval
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurchaseOrderInput" }
      responses:
        "201":
          description: Created purchase request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseOrder" }
  /purchase-orders/{orderId}/decision:
    post:
      operationId: decidePurchaseOrder
      tags: [orders]
      summary: Approve or reject a purchase request
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderDecisionInput" }
      responses:
        "200":
          description: Updated purchase request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseOrder" }
  /purchase-orders/{orderId}/receipts:
    post:
      operationId: receivePurchaseOrder
      tags: [orders, inventory]
      summary: Record a full or partial delivery
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReceiptInput" }
      responses:
        "200":
          description: Updated purchase request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseOrder" }
  /deliveries:
    get:
      operationId: listDeliveries
      tags: [deliveries]
      summary: List receiving records for the selected outlet
      responses:
        "200":
          description: Deliveries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Delivery" }
    post:
      operationId: createDelivery
      tags: [deliveries]
      summary: Record and rule-check a supplier delivery
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryInput" }
      responses:
        "201":
          description: Recorded delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
  /deliveries/{deliveryId}/decision:
    post:
      operationId: decideDelivery
      tags: [deliveries]
      summary: Record a manager decision on a held delivery
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryDecisionInput" }
      responses:
        "200":
          description: Updated delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
  /stock-counts:
    get:
      operationId: listStockCounts
      tags: [counts]
      summary: List recent and active stock counts
      responses:
        "200":
          description: Stock counts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StockCount" }
    post:
      operationId: createStockCount
      tags: [counts]
      summary: Start an all-stock, category, or single-product count
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockCountInput" }
      responses:
        "201":
          description: Created stock count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockCount" }
  /stock-counts/{countId}:
    get:
      operationId: getStockCount
      tags: [counts]
      summary: Get count lines and expected quantities
      parameters:
        - in: path
          name: countId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Stock count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockCount" }
  /stock-counts/{countId}/submit:
    post:
      operationId: submitStockCount
      tags: [counts]
      summary: Submit counted quantities and reconcile inventory
      parameters:
        - in: path
          name: countId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockCountSubmission" }
      responses:
        "200":
          description: Completed stock count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockCount" }
  /movements:
    get:
      operationId: listStockMovements
      tags: [movements]
      summary: Get the recent inventory audit trail
      parameters:
        - in: query
          name: productId
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Inventory movements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StockMovement" }
  /users/{userId}/role:
    patch:
      operationId: updateStoreUserRole
      tags: [users]
      summary: Change a store user's role
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleUpdate" }
      responses:
        "200":
          description: Updated store user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreUser" }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ProductCategory:
      type: string
      minLength: 1
    UserRole:
      type: string
      enum: [staff, supervisor, admin]
    StoreRole:
      type: string
      enum: [owner, admin, supervisor, staff]
    OrderStatus:
      type: string
      enum: [pending, approved, rejected, partially_received, received]
    CountStatus:
      type: string
      enum: [in_progress, completed]
    StoreUser:
      type: object
      required: [id, name, email, role, storeName]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/StoreRole" }
        storeName: { type: string }
    StoreInvitationStatus:
      type: string
      enum: [pending, accepted, expired, revoked]
    StoreInvitation:
      type: object
      required: [id, email, role, status, createdAt, expiresAt]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { $ref: "#/components/schemas/StoreInvitationStatus" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    PasswordResetRequest:
      type: object
      required: [resetToken, expiresAt]
      properties:
        resetToken: { type: string, minLength: 40 }
        expiresAt: { type: string, format: date-time }
    CompletePasswordResetInput:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 40, maxLength: 256 }
        password: { type: string, minLength: 8, maxLength: 256 }
    CompletePasswordResetResponse:
      type: object
      required: [complete]
      properties:
        complete: { type: boolean, enum: [true] }
    SecurityEvent:
      type: object
      required: [id, eventType, actorName, targetName, createdAt]
      properties:
        id: { type: integer }
        eventType: { type: string, enum: [password_reset_link_created] }
        actorName: { type: string }
        targetName: { type: string }
        createdAt: { type: string, format: date-time }
    StoreInvitationInput:
      type: object
      required: [name, email, role]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, minLength: 3, maxLength: 320 }
        role: { $ref: "#/components/schemas/UserRole" }
    StoreroomSummary:
      type: object
      required: [id, name, role]
      properties:
        id: { type: integer }
        name: { type: string }
        role: { $ref: "#/components/schemas/StoreRole" }
    WorkspaceSummary:
      type: object
      required: [id, name, contactEmail, contactPhone, businessAddress, setupComplete, isOwner]
      properties:
        id: { type: integer }
        name: { type: string }
        contactEmail: { type: ["string", "null"], format: email }
        contactPhone: { type: ["string", "null"] }
        businessAddress: { type: ["string", "null"] }
        setupComplete: { type: boolean }
        isOwner: { type: boolean }
    OutletSummary:
      type: object
      required: [id, name, role, contactEmail, contactPhone, businessAddress]
      properties:
        id: { type: integer }
        name: { type: string }
        role: { $ref: "#/components/schemas/StoreRole" }
        contactEmail: { type: ["string", "null"], format: email }
        contactPhone: { type: ["string", "null"] }
        businessAddress: { type: ["string", "null"] }
    CurrentUser:
      type: object
      required: [id, name, email, role, storeName, activeStoreroomId, storerooms, workspace, activeOutletId, outlets]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/StoreRole" }
        storeName: { type: string }
        activeStoreroomId: { type: integer }
        storerooms:
          type: array
          items: { $ref: "#/components/schemas/StoreroomSummary" }
        workspace: { $ref: "#/components/schemas/WorkspaceSummary" }
        activeOutletId: { type: integer }
        outlets:
