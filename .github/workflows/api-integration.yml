name: API workspace and outlet integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  api-integration:
    name: API workspace and outlet checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/api_test
      API_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/api_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck API server and workspace declarations
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Apply current database schema to the temporary test database
        run: pnpm --filter @workspace/db run push-force

      - name: Run API integration tests
        run: pnpm --filter @workspace/api-server test
